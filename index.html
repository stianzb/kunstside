<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Verksliste – Stian Zimmermann">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stian Zimmermann verksliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: én kolonne med verk i et rolig rutenett, hvert verk vist i riktig proporsjon på en felles grunnlinje */
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --ph: #ececec;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 40px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-bottom: 40px; }
  .artist { font-size: 13px; color: var(--muted); letter-spacing: 0.01em; margin: 0; }
  h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }

  .grid {
    list-style: none; margin: 0; padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 40px 16px;
  }
  @media (min-width: 720px) {
    body { padding-block: 64px 96px; }
    header { margin-bottom: 56px; }
    h1 { font-size: 38px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 56px 32px; }
  }
  @media (min-width: 1000px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  .work { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  /* Felles ramme i fotoformat 3:4, så alle verk står likt */
  .frame {
    aspect-ratio: 3 / 4;
    max-width: 100%;
    background: var(--ph);
    overflow: hidden;
  }
  .art {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .meta { display: flex; flex-direction: column; gap: 1px; font-size: 14px; }
  .title { font-weight: 500; }
  .dim, .price { color: var(--muted); font-variant-numeric: tabular-nums; }
  .price { color: var(--fg); }

  .more { margin-top: 72px; padding-top: 40px; border-top: 1px solid var(--line); }
  .more h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; text-align: center; margin: 0 0 32px; }
  @media (min-width: 720px) {
    .more { margin-top: 96px; padding-top: 56px; }
    .more h2 { font-size: 24px; margin-bottom: 48px; }
  }

  footer {
    margin-top: 64px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }

  /* Verket er en knapp som åpner stor visning */
  .open {
    all: unset; display: block; cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .open:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .open .art { transition: opacity .2s ease; }
  @media (hover: hover) { .open:hover .art { opacity: .88; } }

  /* Stor visning */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .lb-top { display: flex; justify-content: space-between; align-items: center; padding-block: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lb-btn {
    font: inherit; font-size: 14px; color: var(--fg);
    background: none; border: 0; padding: 10px 4px; cursor: pointer;
  }
  .lb-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .lb-stage { min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  .lb-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .lb-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px 20px; }
  .lb-meta { display: flex; flex-direction: column; gap: 1px; font-size: 14px; text-align: center; min-width: 0; }
  .lb-nav { font-size: 22px; line-height: 1; padding: 10px 14px; }
  .lb-nav[disabled] { opacity: .25; cursor: default; }
  body.lb-open { overflow: hidden; }
  @media (min-width: 720px) {
    .lb-bottom { justify-content: center; gap: 48px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="artist">Stian Zimmermann</p>
    <h1>Verksliste</h1>
  </header>

  <ul class="grid" id="list"></ul>

  <section class="more">
    <h2>Andre tilgjengelige verk</h2>
    <ul class="grid" id="others"></ul>
  </section>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Verk i stor visning">
  <div class="lb-top">
    <span id="lb-count"></span>
    <button class="lb-btn" id="lb-close" type="button">Lukk</button>
  </div>
  <div class="lb-stage" id="lb-stage"><img class="lb-img" id="lb-img" alt=""></div>
  <div class="lb-bottom">
    <button class="lb-btn lb-nav" id="lb-prev" type="button" aria-label="Forrige verk">&#8592;</button>
    <div class="lb-meta" id="lb-meta"></div>
    <button class="lb-btn lb-nav" id="lb-next" type="button" aria-label="Neste verk">&#8594;</button>
  </div>
</div>

<script>
  const works = [
    { name: "Påfugl 1",          price: 3000, h: 34, w: 46, src: "img/pafugl-1.jpg" },
    { name: "Påfugl 2",          price: 3000, h: 34, w: 46, src: "img/pafugl-2.jpg" },
    { name: "Myte 1",            price: 3300, h: 40, w: 40, src: "img/myte-1.jpg" },
    { name: "Myte 2",            price: 3300, h: 40, w: 40, src: "img/myte-2.jpg" },
    { name: "Lillehjernen 1",    price: 2500, h: 40, w: 27, src: "img/lillehjernen-1.jpg" },
    { name: "Lillehjernen 2",    price: 2500, h: 40, w: 27, src: "img/lillehjernen-2.jpg" },
    { name: "Balanse",           price: 2700, h: 31, w: 50, src: "img/balanse.jpg" },
    { name: "Balalaikaorkester", price: 5000, h: 71, w: 41, src: "img/balalaikaorkester.jpg" },
    { name: "Lunsj 1",           price: 2500, h: 33, w: 36, src: "img/lunsj-1.jpg" },
    { name: "Lunsj 2",           price: 2500, h: 33, w: 36, src: "img/lunsj-2.jpg" },
    { name: "Solsnu 1",          price: 2100, h: 38, w: 37, src: "img/solsnu-1.jpg" },
    { name: "Solsnu 2",          price: 2100, h: 38, w: 37, src: "img/solsnu-2.jpg" }
  ];

  // Andre tilgjengelige verk
  const others = [
    { name: "Den standhaftige tinnsoldat", price: 7500, h: 65, w: 45, src: "img/tinnsoldat.jpg" },
    { name: "Når Sceneteppet går opp",     price: 7500, h: 90, w: 50, src: "img/sceneteppet.jpg" },
    { name: "Maslows stigespill",          price: 7500, h: 60, w: 45, src: "img/maslow.jpg" },
    { name: "Vennligst, ta av deg hodet",  price: 7500, h: 85, w: 60, src: "img/hodet.jpg" }
  ];

  const all = works.concat(others);
  const kr = n => n.toLocaleString("nb-NO").replace(/\s/g, " ") + " kr";

  function metaHTML(wk) {
    const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    return '<span class="title">' + esc(wk.name) + '</span>' +
      '<span class="dim">' + (wk.medium || "Mixed media") + '</span>' +
      '<span class="dim">' + wk.h + ' x ' + wk.w + ' cm</span>' +
      '<span class="price">' + kr(wk.price) + '</span>';
  }

  function render(items, list) {
    items.forEach(wk => {
      const idx = all.indexOf(wk);
      const li = document.createElement("li");
      li.className = "work";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "open";
      btn.setAttribute("aria-label", "Vis " + wk.name + " i stor visning");
      btn.addEventListener("click", () => openLb(idx, btn));

      const frame = document.createElement("div");
      frame.className = "frame";
      const art = document.createElement("img");
      art.className = "art"; art.src = wk.src; art.alt = wk.name; art.loading = "lazy";
      frame.appendChild(art);
      btn.appendChild(frame);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = metaHTML(wk);

      li.append(btn, meta);
      list.appendChild(li);
    });
  }

  render(works, document.getElementById("list"));
  render(others, document.getElementById("others"));

  // Stor visning
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lb-img");
  const lbMeta = document.getElementById("lb-meta");
  const lbCount = document.getElementById("lb-count");
  const prev = document.getElementById("lb-prev");
  const next = document.getElementById("lb-next");
  const closeBtn = document.getElementById("lb-close");
  let cur = 0, opener = null;

  function show(i) {
    cur = i;
    const wk = all[i];
    lbImg.src = wk.src; lbImg.alt = wk.name;
    lbMeta.innerHTML = metaHTML(wk);
    lbCount.textContent = (i + 1) + " / " + all.length;
    prev.disabled = i === 0;
    next.disabled = i === all.length - 1;
  }
  function openLb(i, from) {
    opener = from; show(i);
    lb.hidden = false; document.body.classList.add("lb-open");
    closeBtn.focus();
  }
  function closeLb() {
    lb.hidden = true; document.body.classList.remove("lb-open");
    if (opener) opener.focus({ preventScroll: true });
  }
  const go = d => { const n = cur + d; if (n >= 0 && n < all.length) show(n); };

  closeBtn.addEventListener("click", closeLb);
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  document.getElementById("lb-stage").addEventListener("click", e => { if (e.target !== lbImg) closeLb(); });
  document.addEventListener("keydown", e => {
    if (lb.hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
  });

  // Sveip mellom verk på mobil
  let sx = null, sy = null;
  lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (sx === null || e.touches.length) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  });
</script>
</body>
</html>
